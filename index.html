<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Together List</title>
    <meta name="description" content="A shared list of memories, experiences, and future plans for us." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Our Journey</p>
          <h1>Things We’ve Done Together</h1>
        </div>
      </header>

      <section class="summary-grid">
        <div class="stat-card">
          <span class="stat-label">Total memories</span>
          <strong id="totalCount">0</strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">Latest memory</span>
          <strong id="latestDate">—</strong>
        </div>
      </section>

      <section class="panel form-panel">
        <h2>Add a new memory</h2>
        <form id="memoryForm">
          <div class="field-row">
            <label>
              <span>Date</span>
              <input id="memoryDate" type="date" required />
            </label>
            <label>
              <span>Title</span>
              <input id="memoryTitle" type="text" maxlength="80" placeholder="e.g. Beach trip" required />
            </label>
          </div>
          <label>
            <span>Details</span>
            <textarea id="memoryDetails" rows="3" maxlength="250" placeholder="What did you do together? What made it special?"></textarea>
          </label>
          <div class="button-row">
            <button type="submit" class="primary">Add to list</button>
            <button type="button" id="resetBtn" class="secondary">Reset sample list</button>
          </div>
        </form>
      </section>

      <section class="panel list-panel">
        <div class="list-header">
          <h2>Our shared list</h2>
        </div>
        <ul id="memoryList" aria-live="polite"></ul>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
